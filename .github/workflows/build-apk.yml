name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: client
        run: flutter pub get

      - name: Run flutter analyze
        working-directory: client
        run: flutter analyze --no-fatal-infos

      - name: Decode keystore
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: client/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Create key.properties
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: client/android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/release.jks
          EOF

      - name: Build release APK (signed)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: client
        run: flutter build apk --release

      - name: Build debug APK (PRs / no secrets)
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        working-directory: client
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ricemill-apk-${{ github.sha }}
          path: |
            client/build/app/outputs/flutter-apk/app-release.apk
            client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30
