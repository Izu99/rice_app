# JVM sizing for a 3.7GB RAM machine.
# The previous -Xmx8G -XX:MaxMetaspaceSize=4G asked for ~12GB on a 3.7GB box,
# which made the Gradle daemon thrash swap and get killed mid-build
# ("Gradle build daemon disappeared unexpectedly"). Keep these modest.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1g

# Limit concurrency so Gradle + Kotlin + Dart daemons don't compete for RAM.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
